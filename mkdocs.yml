site_name: Informatique en autonomie
site_description: Cours d'informatique au lycée (SNT, NSI) — cours, exercices corrigés, TP
site_author: Mathieu Thibaud
site_url: https://maththibaud.github.io/informatique-en-autonomie/
repo_url: https://github.com/MathThibaud/informatique-en-autonomie
repo_name: informatique-en-autonomie
edit_uri: ''
copyright: © 2026 Mathieu Thibaud — <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">CC BY-NC-SA 4.0</a>
theme:
  name: material
  language: fr
  custom_dir: overrides
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon-32.png
  palette:
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Passer en mode clair
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Passer en mode sombre
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.indexes
  - navigation.top
  - navigation.footer
  - navigation.tracking
  - navigation.instant
  - navigation.instant.progress
  - toc.follow
  - search.highlight
  - search.suggest
  - content.code.copy
extra_css:
- stylesheets/v3.css
extra_javascript:
- javascripts/mathjax.js
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
- abbr
- attr_list
- md_in_html
- tables
- def_list
- footnotes
- admonition
- toc:
    permalink: '#'
    toc_depth: 3
- pymdownx.details
- pymdownx.superfences: {}
- pymdownx.highlight:
    anchor_linenums: false
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.arithmatex:
    generic: true
    inline_syntax:
    - dollar
    block_syntax:
    - dollar
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.caret
- pymdownx.tilde
plugins:
- search:
    lang: fr
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
extra:
  generator: false
